<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Baby Tracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #fdf8f5;
      --card: #ffffff;
      --border: #e8ddd5;
      --text: #2d2016;
      --muted: #8a7060;
      --feeding: #e8a87c;
      --feeding-light: #fdf0e6;
      --wet: #7cb9e8;
      --wet-light: #e6f3fd;
      --dirty: #a8c97c;
      --dirty-light: #eef6e6;
      --both: #c49bde;
      --both-light: #f4edfd;
      --radius: 14px;
      --shadow: 0 2px 12px rgba(0,0,0,0.08);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 40px;
    }

    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { font-size: 20px; font-weight: 700; }
    .sync { font-size: 12px; color: var(--muted); cursor: pointer; }
    .sync:hover { color: var(--feeding); }

    .main { max-width: 480px; margin: 0 auto; padding: 20px 16px 0; }

    /* Setup */
    .setup { background: var(--card); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; box-shadow: var(--shadow); }
    .setup h2 { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
    .setup p { font-size: 13px; color: var(--muted); margin-bottom: 12px; line-height: 1.5; }
    .setup-row { display: flex; gap: 8px; }
    .setup input {
      flex: 1; padding: 10px 12px; border: 1.5px solid var(--border);
      border-radius: 10px; font-size: 14px; background: var(--bg); color: var(--text); outline: none;
    }
    .setup input:focus { border-color: var(--feeding); }
    .setup button {
      padding: 10px 16px; background: var(--feeding); color: white; border: none;
      border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer;
    }

    /* Summary */
    .summary { background: var(--card); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow); }
    .summary-label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
    .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .stat { text-align: center; }
    .stat .val { font-size: 26px; font-weight: 700; }
    .stat .key { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .last-times { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .last-card { background: var(--card); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); }
    .last-card .icon { font-size: 22px; margin-bottom: 6px; }
    .last-card .ago { font-size: 16px; font-weight: 700; }
    .last-card .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

    /* Charts */
    .chart-card { background: var(--card); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow); }
    .chart-title { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 14px; }
    .bar-chart { display: flex; align-items: flex-end; gap: 6px; height: 70px; }
    .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; height: 100%; }
    .bar-inner { flex: 1; display: flex; align-items: flex-end; width: 100%; }
    .bar { width: 100%; border-radius: 4px 4px 0 0; min-height: 2px; }
    .bar.f { background: var(--feeding); }
    .bar.d { background: var(--wet); }
    .bar-num { font-size: 10px; font-weight: 600; color: var(--text); min-height: 14px; }
    .bar-lbl { font-size: 10px; color: var(--muted); }

    /* History */
    .section-title { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px; }
    .record-list { display: flex; flex-direction: column; gap: 8px; }
    .record {
      background: var(--card); border-radius: var(--radius); padding: 12px 14px;
      box-shadow: var(--shadow); display: flex; align-items: center; gap: 12px;
    }
    .rec-icon {
      width: 38px; height: 38px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0;
    }
    .rec-icon.feeding { background: var(--feeding-light); }
    .rec-icon.wet { background: var(--wet-light); }
    .rec-icon.dirty { background: var(--dirty-light); }
    .rec-icon.both { background: var(--both-light); }
    .rec-info { flex: 1; min-width: 0; }
    .rec-title { font-size: 14px; font-weight: 600; }
    .rec-detail { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .rec-time { font-size: 12px; color: var(--muted); text-align: right; flex-shrink: 0; }

    .empty { text-align: center; color: var(--muted); padding: 32px 20px; font-size: 14px; }
    .more-btn { display: block; width: 100%; margin-top: 10px; padding: 10px; background: transparent; color: var(--muted); border: 1.5px solid var(--border); border-radius: var(--radius); font-size: 13px; cursor: pointer; }
  </style>
</head>
<body>
<header>
  <h1 id="pageTitle">Baby Tracker</h1>
  <span class="sync" id="syncBtn" title="Refresh">↻ Refresh</span>
</header>

<div class="main">
  <div class="setup" id="setupCard">
    <h2>Connect to GitHub</h2>
    <p>Enter a GitHub token (read-only <code>repo</code> scope is fine) to view data from <strong>charraisolutions/baby</strong>.</p>
    <div class="setup-row">
      <input type="password" id="tokenInput" placeholder="ghp_…" />
      <button id="connectBtn">Connect</button>
    </div>
    <p id="setupErr" style="color:#e85c5c;margin-top:8px;font-size:12px"></p>
  </div>

  <div id="dashboard" style="display:none">
    <div class="summary">
      <div class="summary-label">Today</div>
      <div class="summary-grid">
        <div class="stat"><div class="val" id="sFeedings">—</div><div class="key">Feedings</div></div>
        <div class="stat"><div class="val" id="sOz">—</div><div class="key">oz total</div></div>
        <div class="stat"><div class="val" id="sDiapers">—</div><div class="key">Diapers</div></div>
      </div>
    </div>

    <div class="last-times">
      <div class="last-card">
        <div class="icon">🍼</div>
        <div class="ago" id="lastFeed">—</div>
        <div class="sub">last feeding</div>
      </div>
      <div class="last-card">
        <div class="icon">👶</div>
        <div class="ago" id="lastDiap">—</div>
        <div class="sub">last diaper</div>
      </div>
    </div>

    <div class="chart-card">
      <div class="chart-title">Feedings — last 7 days</div>
      <div class="bar-chart" id="feedChart"></div>
    </div>
    <div class="chart-card">
      <div class="chart-title">Diapers — last 7 days</div>
      <div class="bar-chart" id="diapChart"></div>
    </div>

    <div class="section-title">Recent entries</div>
    <div class="record-list" id="recList"></div>
    <button class="more-btn" id="moreBtn" style="display:none">Load more</button>
  </div>
</div>

<script>
const REPO = 'charraisolutions/baby';
const FILE = 'data/records.json';
const PAGE = 25;
let records = [], shown = PAGE;

function cfg() { return localStorage.getItem('bt_token'); }

async function load() {
  const token = cfg();
  if (!token) return;
  document.getElementById('syncBtn').textContent = '↻ Loading…';
  try {
    const r = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE}`, {
      headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json' }
    });
    if (!r.ok) throw new Error((await r.json()).message || r.status);
    const data = await r.json();
    records = JSON.parse(atob(data.content.replace(/\n/g,'')));
    records.sort((a,b) => new Date(b.time) - new Date(a.time));
    document.getElementById('setupCard').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    render();
    document.getElementById('syncBtn').textContent = '↻ Refresh';
  } catch(e) {
    document.getElementById('syncBtn').textContent = '↻ Refresh';
    document.getElementById('setupErr').textContent = 'Error: ' + e.message;
  }
}

function timeAgo(iso) {
  const m = (Date.now() - new Date(iso)) / 60000;
  if (m < 1) return 'just now';
  if (m < 60) return Math.round(m) + 'm ago';
  if (m < 1440) return Math.round(m/60) + 'h ago';
  return Math.round(m/1440) + 'd ago';
}

function fmtTime(iso) {
  const d = new Date(iso), now = new Date();
  const yest = new Date(now); yest.setDate(now.getDate()-1);
  const t = d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  if (d.toDateString()===now.toDateString()) return 'Today '+t;
  if (d.toDateString()===yest.toDateString()) return 'Yesterday '+t;
  return d.toLocaleDateString([],{month:'short',day:'numeric'})+' '+t;
}

function render() {
  const today = new Date().toDateString();
  const todayR = records.filter(r => new Date(r.time).toDateString()===today);
  const feeds = todayR.filter(r=>r.type==='feeding');
  const diaps = todayR.filter(r=>r.type==='diaper');
  const oz = feeds.reduce((s,r)=>s+(parseFloat(r.amount)||0),0);

  document.getElementById('sFeedings').textContent = feeds.length||'0';
  document.getElementById('sOz').textContent = oz>0?oz.toFixed(1):'—';
  document.getElementById('sDiapers').textContent = diaps.length||'0';

  const lf = records.find(r=>r.type==='feeding');
  const ld = records.find(r=>r.type==='diaper');
  document.getElementById('lastFeed').textContent = lf?timeAgo(lf.time):'none yet';
  document.getElementById('lastDiap').textContent = ld?timeAgo(ld.time):'none yet';

  renderChart('feedChart', 'f');
  renderChart('diapChart', 'd');
  renderList();
}

function renderChart(id, kind) {
  const days=[], labels=[];
  for(let i=6;i>=0;i--) {
    const d=new Date(); d.setDate(d.getDate()-i);
    days.push(d.toDateString());
    labels.push(d.toLocaleDateString([],{weekday:'short'}).slice(0,2));
  }
  const type = kind==='f'?'feeding':'diaper';
  const vals = days.map(d=>records.filter(r=>r.type===type&&new Date(r.time).toDateString()===d).length);
  const max = Math.max(...vals,1);
  document.getElementById(id).innerHTML = vals.map((v,i)=>`
    <div class="bar-col">
      <div class="bar-inner"><div class="bar ${kind}" style="height:${Math.round(v/max*100)}%"></div></div>
      <div class="bar-num">${v||''}</div>
      <div class="bar-lbl">${labels[i]}</div>
    </div>`).join('');
}

function iconFor(r) {
  if(r.type==='feeding') return {cls:'feeding',e:'🍼'};
  if(r.diaperType==='wet') return {cls:'wet',e:'💧'};
  if(r.diaperType==='dirty') return {cls:'dirty',e:'💩'};
  return {cls:'both',e:'💩'};
}

function titleFor(r) {
  if(r.type==='feeding') return r.feedingType.charAt(0).toUpperCase()+r.feedingType.slice(1)+' feeding';
  return r.diaperType.charAt(0).toUpperCase()+r.diaperType.slice(1)+' diaper';
}

function detailFor(r) {
  const p=[];
  if(r.type==='feeding') {
    if(r.amount) p.push(r.amount+(r.amountUnit||' oz'));
    if(r.duration) p.push(r.duration+' min');
  }
  if(r.notes) p.push(r.notes);
  return p.join(' · ');
}

function renderList() {
  const list = document.getElementById('recList');
  const slice = records.slice(0,shown);
  if(!slice.length) { list.innerHTML='<div class="empty">No entries yet — log one by chatting with Claude!</div>'; return; }
  list.innerHTML = slice.map(r=>{
    const ic=iconFor(r), det=detailFor(r);
    return `<div class="record">
      <div class="rec-icon ${ic.cls}">${ic.e}</div>
      <div class="rec-info">
        <div class="rec-title">${titleFor(r)}</div>
        ${det?`<div class="rec-detail">${det}</div>`:''}
      </div>
      <div class="rec-time">${fmtTime(r.time)}</div>
    </div>`;
  }).join('');
  document.getElementById('moreBtn').style.display = records.length>shown?'block':'none';
}

document.getElementById('connectBtn').addEventListener('click', async () => {
  const token = document.getElementById('tokenInput').value.trim();
  if(!token) return;
  localStorage.setItem('bt_token', token);
  await load();
});

document.getElementById('tokenInput').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('connectBtn').click(); });
document.getElementById('syncBtn').addEventListener('click', load);
document.getElementById('moreBtn').addEventListener('click', ()=>{ shown+=PAGE; renderList(); });

if(cfg()) load();
</script>
</body>
</html>
